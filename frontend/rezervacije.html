<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rezervacije – Opremnica</title>
  <link rel="stylesheet" href="slog.css">
</head>
<body hidden>
  <header id="glava"></header>
  <main>
    <h1>Rezervacije</h1>
    <p class="podnaslov">Čakajoče rezervacije odobri ali z razlogom zavrni. Najstarejša je na vrhu.</p>

    <p id="napaka" class="napaka" role="alert" hidden></p>

    <h2>Čakajoče</h2>
    <div class="tabela">
      <table>
        <thead>
          <tr><th>Oddano</th><th>Član</th><th>Kos</th><th>Termin</th><th>Namen</th><th>Odločitev</th></tr>
        </thead>
        <tbody id="cakajoce"></tbody>
      </table>
    </div>

    <h2>Odobrene in prevzete</h2>
    <div class="tabela">
      <table>
        <thead>
          <tr><th>Član</th><th>Kos</th><th>Termin</th><th>Namen</th><th>Stanje</th></tr>
        </thead>
        <tbody id="ostale"></tbody>
      </table>
    </div>
  </main>

  <dialog id="zavrnitev">
    <form>
      <h2>Zavrnitev rezervacije</h2>
      <dl>
        <dt>Član</dt>
        <dd id="zavrnitevClan"></dd>
        <dt>Kos</dt>
        <dd id="zavrnitevKos"></dd>
        <dt>Termin</dt>
        <dd id="zavrnitevTermin"></dd>
      </dl>
      <label>Razlog (obvezno)
        <input name="razlog" maxlength="300" required>
      </label>
      <p class="opomba">Razlog bo član videl v svojih rezervacijah.</p>
      <p class="napaka" role="alert" hidden></p>
      <div class="gumbi">
        <button>Potrdi zavrnitev</button>
        <button type="button" class="drugi">Zapri</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="rezervacije.js"></script>
</body>
</html>
